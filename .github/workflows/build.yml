name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-xcode:
    name: Build iOS and macOS apps
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -project appleApp/appleApp.xcodeproj \
          -configuration Debug \
          -scheme appleApp \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        run: |
          xcodebuild build \
          -project appleApp/appleApp.xcodeproj \
          -configuration Debug \
          -scheme appleApp \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO

  swift-package:
    name: Export Swift package and test it with SwiftPM
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Export Swift package
        run: ./gradlew :shared:exportDebugSwiftPackage

      - name: Run Swift tests
        run: swift test --package-path spm-consumer

      - name: Run Swift executable
        run: swift run --package-path spm-consumer

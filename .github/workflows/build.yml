name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-xcode:
    name: Test iOS and macOS apps
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0
        with:
          # Publishes a Build Scan to scans.gradle.com for every Gradle build in the job
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Test on iOS simulator
        run: |
          # Use the first iOS simulator that this Xcode accepts for the scheme.
          # Ineligible destinations are listed with an "error:" field.
          SIMULATOR_ID=$(xcodebuild -project appleApp/appleApp.xcodeproj -scheme appleApp -showdestinations \
            | grep "platform:iOS Simulator" | grep -v -e placeholder -e "error:" | head -1 | sed -E 's/.*id:([^,]+),.*/\1/')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iOS simulator for the appleApp scheme"
            exit 1
          fi
          xcodebuild test \
          -project appleApp/appleApp.xcodeproj \
          -scheme appleApp \
          -destination "id=$SIMULATOR_ID" \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO

      - name: Test on macOS
        run: |
          xcodebuild test \
          -project appleApp/appleApp.xcodeproj \
          -scheme appleApp \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO

  swift-package:
    name: Export Swift package and test it with SwiftPM
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0
        with:
          # Publishes a Build Scan to scans.gradle.com for every Gradle build in the job
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Export Swift package
        run: ./gradlew :shared:exportDebugSwiftPackage

      - name: Run Swift tests
        run: swift test --package-path spm-consumer

      - name: Run Swift executable
        run: swift run --package-path spm-consumer
